<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TodoFlow - Login</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>


    <!-- ========================================
         LOGIN CARD
         ======================================== -->

    <main class="login-card">


        <!-- ========================================
             LEFT BRANDING
             ======================================== -->

        <section class="login-brand">


            <div class="brand">

                <div class="brand-icon">
                    ✓
                </div>

                <span>
                    TodoFlow
                </span>

            </div>


            <div class="brand-content">

                <p class="brand-label">
                    WELCOME BACK
                </p>

                <h1>
                    Stay organized.
                    <span>Stay productive.</span>
                </h1>

                <p>
                    Manage your tasks and get more
                    done every day.
                </p>

            </div>


            <div class="brand-footer">
                Simple. Focused. Productive.
            </div>


        </section>



        <!-- ========================================
             RIGHT LOGIN FORM
             ======================================== -->

        <section class="login-form">


            <div class="form-wrapper">


                <!-- Header -->

                <div class="form-header">

                    <p class="form-label">
                        ACCOUNT LOGIN
                    </p>

                    <h2>
                        Sign in to your account
                    </h2>

                    <p>
                        Enter your details to continue.
                    </p>

                </div>



                <!-- Login Form -->

                <form
                    id="loginForm"
                    onsubmit="login(event)"
                >


                    <!-- Email -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>



                    <!-- Password -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>



                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Sign In
                    </button>


                    <!-- Message -->

                    <p id="message"></p>


                </form>



                <!-- Signup -->

                <p class="signup-link">

                    Don't have an account?

                    <a href="signup.html">
                        Create an account
                    </a>

                </p>


            </div>


        </section>


    </main>



    <script src="login.js"></script>

</body>

</html>
